name: CI - Shell Script Check

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "scripts/**.sh"
      - ".github/workflows/ci.yml"

jobs:
  lint-shell:
    name: Lint & Check Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts folder
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
