# ---------------------------------------------------------------------------
# Startup applications
# Reference: i3 User's Guide §4.19 (Automatically starting applications on
#            i3 startup)
# `exec` runs once when i3 starts (not on `restart`); `exec_always` would
# run on every restart too. `--no-startup-id` disables startup-notification
# support for commands that don't implement that protocol, so i3 doesn't
# wait for a notification that will never arrive.
# ---------------------------------------------------------------------------

# Run XDG autostart .desktop files using dex.
exec --no-startup-id dex --autostart --environment i3

# xss-lock grabs a logind suspend inhibit lock and uses i3lock to lock the
# screen before the system suspends.
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --nofork

# nm-applet: desktop-environment-independent system tray GUI for
# NetworkManager.
exec --no-startup-id nm-applet
