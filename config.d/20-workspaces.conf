# ---------------------------------------------------------------------------
# Workspace names
# Reference: i3 User's Guide §4.16 (Variables), §6.8 (Named workspaces)
# Variables for the default workspaces, referenced by 30-bindings.conf and
# (later) 50-rules.conf. Defined in their own file and included BEFORE both,
# because i3 requires a variable to be defined before the file that uses it
# is parsed (§4.1, include directive limitation).
# ---------------------------------------------------------------------------

#  Automatic back-and-forth when switching to the current workspace.
workspace_auto_back_and_forth yes

#  Display urgency hints for windows that request it (e.g., when a window
#  is minimized or needs attention). The default is 0 ms (no delay).
force_display_urgency_hint 500 ms

set $ws1 "1: "
set $ws2 "2: "
set $ws3 "3: "
set $ws4 "4: "
set $ws5 "5: "
set $ws6 "6: "
set $ws7 "7: "
set $ws8 "8: "
set $ws9 "9: "
set $ws10 "10: "
