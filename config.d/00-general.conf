# ---------------------------------------------------------------------------
# General settings
# Reference: i3 User's Guide §4.3 (Fonts), §4.7 (The floating modifier),
#            §4.23 (Focus follows mouse), §4.24 (Mouse warping),
#            §4.25 (Popups during fullscreen mode), §4.26 (Focus wrapping),
#            §4.30 (Focus on window activation), §4.33 (Tiling drag)
# One-line, global behaviors that don't fit into any other category.
# ---------------------------------------------------------------------------

# Font used for window titles. Also used by i3bar unless a different font is
# set inside the bar {} block. "pango:" enables FreeType/Pango rendering,
# which supports more Unicode glyphs than X core fonts. Requires the Lilex
# Nerd Font to be installed on the system. (§4.3)
font pango:Lilex Nerd Font 10

# The floating modifier lets you move/resize a floating window by holding
# this key and dragging anywhere inside it, without needing to grab the
# titlebar or border directly. (§4.7)
floating_modifier $mod

# Controls how a *tiling* window drag is initiated with the mouse: here,
# either by dragging the titlebar or by holding the floating modifier.
# (§4.33)
tiling_drag modifier titlebar

# Disable "focus follows mouse": moving the cursor over a window no longer
# steals focus. Keyboard-driven focus only ($mod+j/k/l/;) — avoids
# accidental focus changes from touchpad movement on a laptop.
# i3 default is "yes". (§4.23)
focus_follows_mouse yes

# When focus moves to a window on a different output (monitor), warp the
# mouse cursor to the center of that window. Kept at i3's default; mostly
# irrelevant on a single-monitor laptop setup, but explicit here rather than
# left implicit. (§4.24)
mouse_warping output

# When a popup appears while a window is fullscreen (e.g. a dialog from a
# video player), only show it if it belongs to the fullscreen application.
# i3 default, documented explicitly. (§4.25)
popup_during_fullscreen smart

# When focus reaches the edge of a container (no sibling in that direction),
# wrap around to the opposite side. i3 default, documented explicitly.
# (§4.26)
focus_wrapping yes

# If a window requests focus after being activated (e.g. via
# `google-chrome www.example.com`), give it focus only if it's on the
# currently active workspace; otherwise just mark it urgent instead of
# stealing focus. i3 default, documented explicitly. (§4.30)
focus_on_window_activation focus

# When dragging a tiling window, automatically switch to the workspace of
# the output (monitor) that the window is being dragged to. i3 default,
# documented explicitly. (§4.33)
default_orientation auto

# When a new workspace is created, it will use the default layout (tiling).
workspace_layout default

# When a new workspace is created, it will use the default orientation
# (automatic). i3 default, documented explicitly. (§4.33)
title_align center

# When a new workspace is created, it will use the default border style
# (2px). i3 default, documented explicitly. (§4.33)
default_border pixel 2

# When a new floating window is created, it will use the default border style
# (2px). i3 default, documented explicitly. (§4.33)
default_floating_border pixel 2

# When a new workspace is created, it will use the default edge border style
# (smart). i3 default, documented explicitly. (§4.33)
hide_edge_borders smart

#  Automatic back-and-forth when switching to the current workspace.
workspace_auto_back_and_forth no

#  Display urgency hints for windows that request it (e.g., when a window
#  is minimized or needs attention). The default is 0 ms (no delay).
force_display_urgency_hint 0 ms

#  Show marks in the titlebar of windows that have marks set. i3 default,
#  documented explicitly. (§4.31)
show_marks no

#  When a new workspace is created, it will use the default swap modifier
#  (Control). i3 default, documented explicitly. (§4.33)
tiling_drag swap_modifier Control

#  When a new workspace is created, it will use the default tiling drag
#  behavior (modifier). i3 default, documented explicitly. (§4.33)
gaps inner 25
gaps outer -5
smart_gaps off

# ---------------------------------------------------------------------------
# class                 border  backgr. text    indicator child_border
client.focused          $purple $cl     $fg     $pink     $purple
client.focused_inactive $cl     $bg     $comment$cl       $cl
client.unfocused        $bg     $bg     $comment$bg       $bg
client.urgent           $red    $red    $fg     $red      $red
client.placeholder      $bg     $bg     $fg     $bg       $bg

client.background       $bg
