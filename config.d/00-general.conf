# ---------------------------------------------------------------------------
# General settings
# Reference: i3 User's Guide §4.3 (Fonts), §4.7 (The floating modifier),
#            §4.33 (Tiling drag)
# One-line, global behaviors that don't fit into any other category.
# ---------------------------------------------------------------------------

# Font used for window titles. Also used by i3bar unless a different font is
# set inside the bar {} block. "pango:" enables FreeType/Pango rendering,
# which supports more Unicode glyphs than X core fonts. (§4.3)
font pango:monospace 8

# The floating modifier lets you move/resize a floating window by holding
# this key and dragging anywhere inside it, without needing to grab the
# titlebar or border directly. (§4.7)
floating_modifier $mod

# Controls how a *tiling* window drag is initiated with the mouse: here,
# either by dragging the titlebar or by holding the floating modifier.
# (§4.33)
tiling_drag modifier titlebar
