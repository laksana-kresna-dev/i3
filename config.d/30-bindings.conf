# ---------------------------------------------------------------------------
# Keybindings
# Reference: i3 User's Guide §4.4 (Keyboard bindings), §4.6 (Binding modes),
#            §6 (List of commands)
# All bindsym directives: launching programs, window/focus management,
# workspaces, and the resize mode. $mod is defined in the main `config`
# file; $ws1-$ws10 are defined in 20-workspaces.conf (included before this
# file, per the include-order rule in §4.1).
# ---------------------------------------------------------------------------

# --- Audio Keys (PipeWire / wpctl) ---
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh up
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh down
bindsym XF86AudioMute        exec --no-startup-id ~/.config/i3/scripts/volume.sh mute

# --- Microphone Keys ---
bindsym $mod+XF86AudioRaiseVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh mic-up
bindsym $mod+XF86AudioLowerVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh mic-down
bindsym $mod+XF86AudioMute        exec --no-startup-id ~/.config/i3/scripts/volume.sh mic-mute

# --- Media Keys (playerctl / mpc) ---
bindsym XF86AudioPlay exec --no-startup-id ~/.config/i3/scripts/media.sh play-pause
bindsym XF86AudioNext exec --no-startup-id ~/.config/i3/scripts/media.sh next
bindsym XF86AudioPrev exec --no-startup-id ~/.config/i3/scripts/media.sh prev

# --- Screen Brightness Keys (brightnessctl) ---
bindsym XF86MonBrightnessUp   exec --no-startup-id ~/.config/i3/scripts/brightness.sh up
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/i3/scripts/brightness.sh down

# Open a terminal. (§2.1)
bindsym $mod+Return exec --no-startup-id $term
bindsym $mod+Shift+Return exec --no-startup-id $term --class "kitty-float"

# Open a terminal with ranger file manager. (§2.1)
bindsym $mod+f exec --no-startup-id $term --class "kitty-filemanager" ranger

# Open a terminal with pulsemixer. (§2.1)
bindsym $mod+v exec --no-startup-id $term --class "kitty-volume" pulsemixer

# pavucontrol (PulseAudio Volume Control) is a volume control tool ("mixer") for the PulseAudio sound server. It allows you to adjust the volume of individual applications, as well as the overall system volume. You can also use it to manage audio input and output devices, such as microphones and speakers. (§2.1)
bindsym $mod+Shift+v exec --no-startup-id pavucontrol

# Open a browser. (§2.1)
bindsym $mod+b exec --no-startup-id $browser 

# Open a file manager. (§2.1)
bindsym $mod+Shift+f exec --no-startup-id $filemanager

# Kill (close) the focused window. (§2.5)
bindsym $mod+x kill

# Kill (close) a window by clicking on it. (§2.5)
bindsym $mod+Shift+x exec --no-startup-id xkill

# Fullscreen screenshot (Tombol Print Screen)
bindsym Print exec --no-startup-id scrot -i -f '%Y-%m-%d_%H-%M.png' -e 'mv $f ~/Pictures/Screenshots/'

# Area / Selection screenshot (Shift + Print Screen)
bindsym Ctrl+Print exec --no-startup-id scrot -i -s -f '%Y-%m-%d_%H-%M.png' -e 'mv $f ~/Pictures/Screenshots/'

# Active Window screenshot (Alt + Print Screen)
bindsym Shift+Print exec --no-startup-id scrot -i -u '%Y-%m-%d_%H-%M.png' -e 'mv $f ~/Pictures/Screenshots/'

# Open dmenu, a program launcher. (§2.4)
bindsym $mod+d exec --no-startup-id dmenu_run

# Change focus between windows. (§2.1)
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# Alternative focus bindings using the arrow keys.
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move the focused window. (§6.5)
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Alternative move bindings using the arrow keys.
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Split the current container. (§2.1, §6.2)
bindsym $mod+s split toggle

# Toggle fullscreen for the focused container. (§2.3)
bindsym $mod+Ctrl+f fullscreen toggle

# Change the layout of the focused container. (§2.2, §6.3)
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# Toggle the focused container to be sticky (visible on all workspaces). (§2.11)
bindsym $mod+Ctrl+space sticky toggle

# Toggle the focused container between tiling and floating. (§2.11)
bindsym $mod+Shift+space floating toggle

# Toggle focus between tiling and floating windows.
bindsym $mod+space focus mode_toggle

# Focus the parent container. (§3.3)
bindsym $mod+a focus parent

# workspace next/prev (switch to the next/previous workspace). (§2.6, §6.8)
bindsym $mod+Next workspace next
bindsym $mod+Prior workspace prev

# Switch between the current and the previously focused one
bindsym $mod+Tab workspace back_and_forth
bindsym $mod+Shift+Tab move container to workspace back_and_forth

# Switch focus between windows in the current workspace.
bindsym $alt+Tab focus next
bindsym $alt+Shift+Tab focus prev

# Switch to a workspace. (§2.6, §6.8)
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# Move the focused container to a workspace. (§2.7)
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# Reload the configuration file in place, without restarting i3. (§6.20)
bindsym $mod+Shift+c reload

# Restart i3 in place (preserves your layout/session). (§2.9, §6.20)
bindsym $mod+Shift+r restart

# Exit i3 (ends the X session), with a confirmation prompt via i3-nagbar.
# (§2.10)
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# Resize mode: lets you resize the focused window using j/k/l/; (or the
# arrow keys) without needing the mouse. (§2.8, §4.6, §6.12)
mode "resize" {
        bindsym h resize shrink width 2 px or 2 ppt
        bindsym j resize grow height 2 px or 2 ppt
        bindsym k resize shrink height 2 px or 2 ppt
        bindsym l resize grow width 2 px or 2 ppt

        # Same bindings, but for the arrow keys.
        bindsym Left resize shrink width 2 px or 2 ppt
        bindsym Down resize grow height 2 px or 2 ppt
        bindsym Up resize shrink height 2 px or 2 ppt
        bindsym Right resize grow width 2 px or 2 ppt

        # Exit resize mode back to the default mode.
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

# Enter resize mode.
bindsym $mod+r mode "resize"
