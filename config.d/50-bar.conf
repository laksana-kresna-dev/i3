# ---------------------------------------------------------------------------
# i3bar
# Reference: i3 User's Guide §5 (Configuring i3bar), §5.2 (Statusline
#            command)
# i3bar runs as a separate process from i3 itself, displaying workspaces
# plus whatever system information i3status reports via its stdout.
# ---------------------------------------------------------------------------
bar {
        # stauts_command specifies the command to run to generate the status line
        status_command i3status --config ~/.config/i3/config.d/60-i3status.conf
     
        # mode specifies the mode of the bar. Valid values are dock, hide, and invisible.
        mode dock

        # hide_state specifies the state of the bar when in hide mode. Valid values are hide, show, and toggle.
        hidden_state hide

        # modifier specifies the modifier key to use for mouse bindings. Valid values are Mod1, Mod2, Mod3, Mod4, and Mod5.
        modifier $mod

        #bindings for mouse buttons on the bar. Valid values are button1, button2, button3, button4, button5, button6, and button7.
        bindsym button1 nop
        bindsym button2 nop
        bindsym button3 nop
        bindsym button4 nop
        bindsym button5 nop
        bindsym button6 nop
        bindsym button7 nop

        # position specifies the position of the bar. Valid values are top, bottom, left, and right.
        position top

        # output specifies the output to display the bar on. Valid values are primary, all, and the name of an output as reported by xrandr.
        output primary

        # tray_output specifies the output to display the system tray on. Valid values are primary, all, and the name of an output as reported by xrandr.
        tray_output primary

        # tray_padding specifies the padding between the tray and the bar. Valid values are integers.
        tray_padding 8

        # font specifies the font to use for the bar. Valid values are any font supported by Pango.
        font pango:Lilex Nerd Font 10

        # separator_symbol specifies the symbol to use as a separator between workspaces. Valid values are any string.
        separator_symbol ":|:"

        # workspace_buttons specifies whether to display workspace buttons on the bar. Valid values are yes and no.
        workspace_buttons yes

        # workspace_min_width specifies the minimum width of a workspace button. Valid values are integers.
        workspace_min_width 50

        #strip_workspace_numbers specifies whether to strip workspace numbers from the workspace buttons. Valid values are yes and no.
        strip_workspace_numbers yes

        #strip_workspace_name specifies whether to strip workspace names from the workspace buttons. Valid values are yes and no.
        strip_workspace_name yes
        
        # binding_mode_indicator specifies whether to display the binding mode indicator on the bar. Valid values are yes and no.
        binding_mode_indicator yes

        # padding specifies the padding around the bar. Valid values are integers.
        padding 3px 0

        # colors specifies the colors to use for the bar. Valid values are any color supported by Pango.
        colors {
                background #282a36
                statusline #f8f8f2
                separator  #6272a4

                # class            border  backgr. text
                focused_workspace  #bd93f9 #44475a #f8f8f2
                active_workspace   #282a36 #282a36 #f8f8f2
                inactive_workspace #282a36 #282a36 #6272a4
                urgent_workspace   #ff5555 #ff5555 #f8f8f2
                binding_mode       #ffb86c #ffb86c #282a36
        }
}
