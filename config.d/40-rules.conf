# ---------------------------------------------------------------------------
# Window rules
# Reference: i3 User's Guide §4.14 (for_window), §4.18 (assign)
#
# for_window <criteria> <command>
#   Runs a command automatically whenever i3 encounters a window matching
#   the given criteria (class, instance, title, window_role, etc). Re-evaluated
#   every time a matching window's properties change.
#
# assign <criteria> <workspace>
#   Sends a window straight to a specific workspace the moment the
#   application maps it. Unlike for_window + move, this only fires once, at
#   window-creation time — recommended when you just want an app to always
#   open on a given workspace.
#
# No rules are defined yet — this file exists as a placeholder so future
# rules have an obvious, documented home instead of being scattered into
# 30-bindings.conf. $ws1-$ws10 (from 20-workspaces.conf, included before
# this file) are available here if a future assign targets one of them.
#
# Send all windows to workspace 1 on creation.
assign [class="^kitty$"] $ws1

# Send all windows to workspace 2 on creation.
assign [class="^zen$"] $ws2
assign [class="^Google-chrome$"] $ws2
assign [class="^Brave-browser$"] $ws2

# Send all windows to workspace 3 on creation.
assign [class="^antigravity$"] $ws3
assign [class="^com.microsoft.VSCode$"] $ws3
assign [class="^DBeaver$"] $ws3
assign [class="^Mysql-workbench-bin$"] $ws3
assign [class="^beekeeper-studio$"] $ws3
assign [class="^MongoDB Compass$"] $ws3
assign [class="^Postman$"] $ws3

# Send all windows to workspace 4 on creation.
assign [class="^kitty-filemanager$"] $ws4
assign [class="^Thunar$"] $ws4
assign [class="^Pcmanfm$"] $ws4
assign [class="^pcmanfm-qt$"] $ws4

# Send all windows to workspace 5 on creation.
assign [class="^md.obsidian.Obsidian$"] $ws5
assign [class="^libreoffice-startcenter$"] $ws5
assign [class="^libreoffice-writer$"] $ws5
assign [class="^libreoffice-calc$"] $ws5
assign [class="^libreoffice-impress$"] $ws5
assign [class="^ONLYOFFICE$"] $ws5
assign [class="^wps$"] $ws5

# Send all windows to workspace 6 on creation.
assign [class="^vlc$"] $ws6

# Send all windows to workspace 7 on creation.
assign [class="^TelegramDesktop$"] $ws7
assign [class="^discord$"] $ws7
assign [class="^zoom$"] $ws7

# Send all windows to workspace 8 on creation.
assign [class="^Gimp$"] $ws8
assign [class="^Inkscape$"] $ws8
assign [class="^kdenlive$"] $ws8

# Send all windows to workspace 9 on creation.
assign [class="^obs$"] $ws9

# Send all windows to workspace 10 on creation.
assign [class="^Lxappearance$"] $ws10

# for_window rules to set the layout of each workspace to tabbed.
for_window [workspace="2"] layout tabbed
for_window [workspace="3"] layout tabbed
for_window [workspace="4"] layout tabbed
for_window [workspace="5"] layout tabbed
for_window [workspace="6"] layout tabbed
for_window [workspace="7"] layout tabbed
for_window [workspace="8"] layout tabbed
for_window [workspace="9"] layout tabbed
for_window [workspace="10"] layout tabbed

# Always open windows as floating.
for_window [class="^Nm-connection-editor$"] floating enable
for_window [class="^pavucontrol$"] floating enable, resize set 600 450, move position center
for_window [class="^Blueman-manager$"] floating enable
for_window [class="^Firewall-config$"] floating enable
for_window [class="^kitty-float$"] floating enable
for_window [class="^Xdm-app$"] floating enable
for_window [class="^transmission-gtk$"] floating enable

for_window [class="^kitty-volume$"] floating enable
for_window [class="^zen$" instance="^Places$"] floating enable, resize set 50 ppt 50 ppt, move position center
for_window [class="^zen$" instance="^Navigator$" title="^Torrents*"] floating enable, resize set 35 ppt 60 ppt, move position center
for_window [class="^zen$" instance="^Toolkit$" title="^Picture-in-Picture$"] floating enable, sticky enable, resize set 25 ppt 25 ppt, move position 74 ppt 74 ppt

# no_focus rules
no_focus [class="^zen$" instance="^Toolkit$" title="^Picture-in-Picture$"]

#
# ---------------------------------------------------------------------------
