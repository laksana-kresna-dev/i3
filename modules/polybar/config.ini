[global/wm]
include-directory = ~/.config/i3/modules/polybar/modules

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.selection}
label-active-underline= ${colors.purple}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.trans}
label-empty-padding = 1

[bar/i3bar]
width = 97.5%
height = 24pt
offset-x = 1.25%
offset-y = 2%
radius = 5
dpi = 96

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3
override-redirect = true

module-margin = 1
padding-left = 0
padding-right = 1

background = ${colors.background}
foreground = ${colors.foreground}

separator = " "

font-0 = "Lilex Nerd Font:style=Regular:size=10;3"
font-1 = "Lilex Nerd Font:style=Bold:size=10;3"
font-2 = "Lilex Nerd Font:style=Medium:size=10;3"
font-3 = "Lilex Nerd Font Mono:style=Regular:size=12;3"

modules-left = i3
modules-center = cpu temperature memory filesystem
modules-right = date tray

; vim:ft=dosini
