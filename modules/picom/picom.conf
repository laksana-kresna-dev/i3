###############################################################################
#                           PICOM CONFIGURATION                               #
#               Optimized for i3wm - Modern, Clean & High Performance         #
###############################################################################

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true;
daemon = true;

# Render optimization
use-damage = true;
dithered-present = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

# Fullscreen performance optimization
unredir-if-possible = true;
unredir-if-possible-delay = 0;

log-level = "warn";

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 25;
shadow-opacity = 1.00;
shadow-offset-x = -25;
shadow-offset-y = -25;
shadow-color = "#000000";
crop-shadow-to-monitor = true;

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.005;
fade-out-step = 0.005;
fade-delta = 1;
no-fading-openclose = false;
no-fading-destroyed-argb = true;

#################################
#       Transparency & Blur     #
#################################

frame-opacity = 1.0;
inactive-dim-fixed = true;

# Dual Kawase Blur setup
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-kern = "3x3box";

#################################
#           Corners             #
#################################

corner-radius = 0;

#################################
#         Window Rules          #
#################################

rules: (
  # 1. Global Default Rule
  {
    match = "window_type = 'normal'";
    fade = true;
    shadow = true;
    opacity = 1.0;
  },

  # 2. Tooltips (Lightweight, instant, no blur/shadow/fade)
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = false;
    blur-background = false;
    opacity = 1.0;
    corner-radius = 0;
  },

  # 3. Menus, Popups, Utility, & Dropdown Menus
  {
    match = "window_type = 'menu' || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'popup_menu' || "
            "window_type = 'utility'";
    fade = true;
    shadow = false;
    blur-background = false;
    opacity = 1.0;
  },

  # 4. Dialogs (With crisp shadow, no blur)
  {
    match = "window_type = 'dialog'";
    fade = true;
    shadow = true;
    blur-background = false;
    opacity = 1.0;
  },

  # 5. Docks, Panels, & Desktop (Polybar, Dunst, etc.)
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop' || "
            "class_g = 'Xfwm4' || "
            "class_g = 'Polybar'";
    fade = true;
    shadow = true;
    opacity = 1.0;
    blur-background = false;
    corner-radius = 0;
  },

  # 6. Notifications & Specific Overlays (No shadow, full opacity)
  {
    match = "name = 'Notification' || "
            "name = 'cpt_frame_xcb_window' || "
            "name = 'rect-overlay' || "
            "class_g ?= 'Notify-osd' || "
            "class_g ?= 'zoom' || "
            "class_g = 'Conky' || "
            "class_g = 'Cairo-clock' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
    opacity = 1.0;
    blur-background = false;
  },

  # 7. i3-frame (Prevents overlapping shadows in tabbed/stacked layouts)
  {
    match = "class_g = 'i3-frame'";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
    opacity = 1.0;
  },

  # 8. Special App Exclusions (Browsers / Specific Apps)
  {
    match = "class_g = 'Chromium'";
    blur-background = false;
  },

  # 9. Terminal Emulators (Kitty / Alacritty with subtle transparency and blur)
  {
    match = "class_g = 'kitty' || class_g = 'Alacritty'";
    opacity = 0.95;
    blur-background = true;
  },

  # 10. File Manager & Fully Opaque Apps
  {
    match = "class_g = 'Thunar'";
    opacity = 1.0;
    blur-background = false;
  }
);
